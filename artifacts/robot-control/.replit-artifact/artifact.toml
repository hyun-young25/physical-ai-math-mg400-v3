kind = "web"
previewPath = "/"
title = "Robot Control Panel"
version = "1.0.0"
id = "artifacts/robot-control"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23160

[services.development]
run = "pnpm --filter @workspace/robot-control run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/robot-control", "run", "build" ]
publicDir = "artifacts/robot-control/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23160"
BASE_PATH = "/"
